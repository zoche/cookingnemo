<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capt. Nemo cooking 20,000 leagues below</title>
    <style>
        :root {
            --bg-deep: #050b14;
            --bg-card: #0c1829;
            --bg-card-hover: #132238;
            --accent-copper: #c87d55;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --text-main: #d0d7de;
            --text-muted: #8b949e;
            --border-color: #1f334d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.6; }

        .landing-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #0c1b33 0%, #02060c 100%); border-bottom: 4px solid var(--accent-copper); padding: 2rem; text-align: center; }
        .landing-image-wrapper { max-width: 600px; width: 100%; height: 75vh; display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem; }
        .landing-cover-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; border: 3px solid var(--accent-copper); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9); }
        .scroll-down-hint { color: var(--accent-gold-light); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: bounce 2s infinite; opacity: 0.8; }
        .scroll-down-hint:hover { opacity: 1; color: var(--accent-gold); }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-4px); } }

        header { background: linear-gradient(135deg, #02060c 0%, #0c1b33 100%); border-bottom: 3px solid var(--accent-copper); padding: 4rem 2rem 3rem 2rem; text-align: center; position: relative; overflow: hidden; }
        h1 { font-size: 3rem; color: var(--accent-gold-light); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; border-bottom: 2px solid var(--accent-copper); display: inline-block; padding-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: var(--accent-copper); font-style: italic; margin-top: 1rem; }
        .container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; display: grid; grid-template-columns: 280px 1fr; gap: 3rem; }
        
        aside { position: sticky; top: 2rem; height: calc(100vh - 4rem); overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; }
